name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System deps (egui / nih-plug)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p pirate-sampler-dsp -p pirate-sampler -- -D warnings
      - run: cargo test --workspace --exclude xtask

  # Cross-compile / pluginval can be added when Windows targets are in scope.
  # Example (local):
  #   cargo xtask bundle pirate-sampler --release
  #   pluginval --validate-in-process target/bundled/pirate-sampler.vst3
